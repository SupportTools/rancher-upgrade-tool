name: CI/CD

# TRIGGERS: never add `pull_request` here. Test -> Build -> Publish -> Deploy chain
# via `needs:` with no `if:` branch guard on any job, so a PR trigger would build an
# image, publish a chart and roll unmerged code to all six environments including
# rancher.tips. PR validation lives in validate.yml, which holds no secrets.
#
# The nightly `schedule: "0 0 * * *"` was removed: it redeployed every environment
# including production each midnight with no code change and nobody watching, and
# the runtime base was unpinned so the artifact differed night to night. That is
# also incompatible with fail-closed catalog validation, which would turn one bad
# dataset into an unattended 00:00 outage.
#
# If the cron was delivering base-image patches, replace it deliberately: a
# scheduled job that opens a PR, not one that deploys.
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      # Single definition, shared with validate.yml and with humans. This job used
      # to run its own inline golint/staticcheck/go vet/go mod sequence while the
      # makefile described something different, and nothing checked the two agreed.
      #
      # This also gets `go test` into the pipeline for the first time: the job was
      # named Test and ran no tests, because `go test ./...` against a package with
      # no test files exits 0 and looked like a passing gate.
      - name: Run the same checks humans run
        run: make ci

      - name: Security scanning
        run: |
          gosec ./...

  Build:
    needs: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build backend
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --build-arg VERSION="v${{ github.run_number }}" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --cache-from supporttools/rancher-upgrade-tool:latest \
            -t supporttools/rancher-upgrade-tool:v${{ github.run_number }} \
            -t supporttools/rancher-upgrade-tool:latest \
            --push \
            -f Dockerfile .

  Publish:
    runs-on: ubuntu-latest
    needs:
      - Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Helm Lint
        run: helm lint charts/rancher-upgrade-tool/

      - name: Package Helm chart
        run: |
          export CHART_VERSION="v${{ github.run_number }}"
          export APP_VERSION="v${{ github.run_number }}"
          export IMAGE_TAG="v${{ github.run_number }}"
          echo "CHART_VERSION=${CHART_VERSION}"
          echo "APP_VERSION=${APP_VERSION}"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          envsubst < charts/rancher-upgrade-tool/Chart.yaml.template > charts/rancher-upgrade-tool/Chart.yaml
          envsubst < charts/rancher-upgrade-tool/values.yaml.template > charts/rancher-upgrade-tool/values.yaml
          helm package charts/rancher-upgrade-tool --destination helm/repo

      - name: Checkout helm-chart repository
        uses: actions/checkout@v4
        with:
          repository: supporttools/helm-chart
          path: helm-chart
          token: ${{ secrets.BOT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"

      - name: Update Helm repository
        run: |
          cp helm/repo/rancher-upgrade-tool-*.tgz helm-chart/
          cd helm-chart
          helm repo index . --url https://charts.support.tools/
          git add .
          git commit -m "Update Helm chart for rancher-upgrade-tool"
          git push

  Deploy:
    runs-on: ubuntu-latest
    needs: Publish
    strategy:
      max-parallel: 1
      matrix:
        environment: [mst, dev, qas, tst, stg, prd]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Kubeconfig
        run: |
          if [[ "${{ matrix.environment }}" == "prd" ]] || [[ "${{ matrix.environment }}" == "stg" ]]; then
            if [[ -z "${{ secrets.KUBECONFIG_PROD }}" ]]; then
              echo "Error: KUBECONFIG_PROD secret is not set or is empty"
              echo "Please configure the KUBECONFIG_PROD secret in GitHub repository settings"
              exit 1
            fi
            echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig
          else
            if [[ -z "${{ secrets.KUBECONFIG_DEV }}" ]]; then
              echo "Error: KUBECONFIG_DEV secret is not set or is empty"
              echo "Please configure the KUBECONFIG_DEV secret in GitHub repository settings"
              exit 1
            fi
            echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > kubeconfig
          fi
          chmod 600 kubeconfig
          
          # Verify kubeconfig is valid
          if ! kubectl --kubeconfig=kubeconfig config view --minify > /dev/null 2>&1; then
            echo "Error: Invalid kubeconfig file"
            echo "The kubeconfig file exists but appears to be malformed"
            exit 1
          fi
          
          # Set KUBECONFIG environment variable
          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV

      - name: Deploy ArgoCD Project
        run: kubectl apply -f argocd/project.yaml --validate=false

      - name: Deploy Environment - ${{ matrix.environment }}
        run: |
          ENVIRONMENT=${{ matrix.environment }}
          CHART_VERSION="v${{ github.run_number }}"

          # Check if application exists
          if kubectl -n argocd get application rancherupgrade-${ENVIRONMENT} &>/dev/null; then
            echo "ArgoCD Application 'rancherupgrade-${ENVIRONMENT}' exists. Patching targetRevision to ${CHART_VERSION}."
            kubectl -n argocd patch application "rancherupgrade-${ENVIRONMENT}" \
              --type merge \
              -p "{\"spec\":{\"source\":{\"targetRevision\":\"${CHART_VERSION}\"}}}"
          else
            echo "ArgoCD Application 'rancherupgrade-${ENVIRONMENT}' does not exist. Creating..."
            sed "s/CHARTVERSION/${CHART_VERSION}/g" argocd/${ENVIRONMENT}.yaml \
            | kubectl -n argocd apply -f - --validate=false
          fi

      - name: Verify the deploy actually happened - ${{ matrix.environment }}
        # Replaces a poll of .status.health.status alone. ArgoCD tracks sync and
        # health separately, so immediately after patching targetRevision the OLD
        # pods are still running and still Healthy: the previous gate saw Healthy on
        # its first attempt and passed having deployed nothing.
        #
        # scripts/verify-deploy.sh checks revision equality FIRST, then Synced, then
        # Healthy, then queries the running service for an answer it must always be
        # able to plan. Its logic is covered by deploy_verify_test.go, which drives
        # it with a stub kubectl through exactly that false-green scenario.
        env:
          MAX_TRIES: 60
          SLEEP_TIME: 10
        run: |
          set -euo pipefail
          ENVIRONMENT=${{ matrix.environment }}
          CHART_VERSION="v${{ github.run_number }}"

          # Only prd is publicly routable (rancher.tips). The other five need a
          # port-forward from the runner, which is why the probe takes a URL rather
          # than assuming one. Note this lengthens every deploy, and the matrix is
          # max-parallel 1 across six environments.
          if [ "$ENVIRONMENT" = "prd" ]; then
            PROBE_HOST="https://rancher.tips"
          else
            kubectl -n "rancherupgrade-${ENVIRONMENT}" port-forward \
              "svc/rancher-upgrade-tool" 18080:80 >/tmp/pf.log 2>&1 &
            PF_PID=$!
            trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break
              sleep 1
            done
            PROBE_HOST="http://127.0.0.1:18080"
          fi

          # A query the catalog must always be able to plan. Zero destinations here
          # means the catalog failed to load or the planner is broken, and an empty
          # result is the answer that reads to a user as "you are already current".
          export PROBE_URL="${PROBE_HOST}/api/plan-upgrade?rancher=2.9.6&local_platform=rke2&local_k8s=v1.28&downstream_platform=rke2&downstream_k8s=v1.28"

          ./scripts/verify-deploy.sh "$ENVIRONMENT" "$CHART_VERSION"
