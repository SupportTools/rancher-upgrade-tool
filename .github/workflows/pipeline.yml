name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # This will run every day at midnight UTC

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Install static analysis tools
        run: |
          go install golang.org/x/lint/golint@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Install dependency management tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install github.com/psampaz/go-mod-outdated@latest

      - name: Go static analysis
        run: |
          golint ./...
          staticcheck ./...
          go vet ./...

      - name: Dependency management
        run: |
          go mod vendor
          go mod verify
          go mod tidy

      - name: Security scanning
        run: |
          gosec ./...

  Build:
    needs: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build backend
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --build-arg VERSION="v${{ github.run_number }}" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --cache-from supporttools/rancher-upgrade-tool:latest \
            -t supporttools/rancher-upgrade-tool:v${{ github.run_number }} \
            -t supporttools/rancher-upgrade-tool:latest \
            --push \
            -f Dockerfile .

  Publish:
    runs-on: ubuntu-latest
    needs:
      - Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Helm Lint
        run: helm lint charts/rancher-upgrade-tool/

      - name: Package Helm chart
        run: |
          export CHART_VERSION="v${{ github.run_number }}"
          export APP_VERSION="v${{ github.run_number }}"
          export IMAGE_TAG="v${{ github.run_number }}"
          echo "CHART_VERSION=${CHART_VERSION}"
          echo "APP_VERSION=${APP_VERSION}"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          envsubst < charts/rancher-upgrade-tool/Chart.yaml.template > charts/rancher-upgrade-tool/Chart.yaml
          envsubst < charts/rancher-upgrade-tool/values.yaml.template > charts/rancher-upgrade-tool/values.yaml
          helm package charts/rancher-upgrade-tool --destination helm/repo

      - name: Checkout helm-chart repository
        uses: actions/checkout@v4
        with:
          repository: supporttools/helm-chart
          path: helm-chart
          token: ${{ secrets.BOT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"

      - name: Update Helm repository
        run: |
          cp helm/repo/rancher-upgrade-tool-*.tgz helm-chart/
          cd helm-chart
          helm repo index . --url https://charts.support.tools/
          git add .
          git commit -m "Update Helm chart for rancher-upgrade-tool"
          git push

  Deploy:
    # In-cluster ARC runner on a1-ops-prd (namespace arc-runners-supporttools); required so the
    # runtime-minted, namespace-scoped token can reach the cluster's own apiserver + in-cluster CA.
    runs-on: self-hosted-linux
    needs: Publish
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC -> Vault
    strategy:
      max-parallel: 1
      matrix:
        environment: [mst, dev, qas, tst, stg, prd]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # Keyless: GitHub OIDC -> Vault jwt auth. exportToken makes VAULT_TOKEN available to the mint step.
      - name: Vault login (GitHub OIDC)
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.support.tools
          method: jwt
          path: github-actions # the jwt auth mount
          role: gha-rancher-upgrade-tool
          jwtGithubAudience: https://github.com/SupportTools # matches bound_audiences
          exportToken: true # -> VAULT_TOKEN env for the next step

      # Mint the short-lived (1h), namespace-scoped Kubernetes token and build a kubeconfig from it.
      # The kubernetes secrets engine generates on WRITE (PUT + kubernetes_namespace), so it must be
      # requested explicitly here. In-cluster runner => talk to a1-ops-prd's own apiserver + in-cluster CA.
      - name: Mint short-lived Kubernetes token and build kubeconfig
        env:
          VAULT_ADDR: https://vault.support.tools
        run: |
          KUBE_TOKEN=$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
            -X PUT -d '{"kubernetes_namespace":"arc-runners-supporttools"}' \
            "${VAULT_ADDR}/v1/kubernetes-onprem/creds/rancher-upgrade-tool" \
            | jq -r '.data.service_account_token')
          test -n "$KUBE_TOKEN" && test "$KUBE_TOKEN" != null || { echo "::error::failed to mint K8s token"; exit 1; }
          echo "::add-mask::$KUBE_TOKEN"
          kubectl config set-cluster onprem \
            --server=https://kubernetes.default.svc:443 \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            --embed-certs=true --kubeconfig=kubeconfig
          kubectl config set-credentials ci --token="${KUBE_TOKEN}" --kubeconfig=kubeconfig
          kubectl config set-context ci --cluster=onprem --user=ci --namespace=argocd --kubeconfig=kubeconfig
          kubectl config use-context ci --kubeconfig=kubeconfig
          chmod 600 kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"

      # ArgoCD AppProject is managed by cluster-services; the scoped CI token cannot apply AppProjects.

      - name: Deploy Environment - ${{ matrix.environment }}
        run: |
          ENVIRONMENT=${{ matrix.environment }}
          CHART_VERSION="v${{ github.run_number }}"

          # Check if application exists
          if kubectl -n argocd get application rancherupgrade-${ENVIRONMENT} &>/dev/null; then
            echo "ArgoCD Application 'rancherupgrade-${ENVIRONMENT}' exists. Patching targetRevision to ${CHART_VERSION}."
            kubectl -n argocd patch application "rancherupgrade-${ENVIRONMENT}" \
              --type merge \
              -p "{\"spec\":{\"source\":{\"targetRevision\":\"${CHART_VERSION}\"}}}"
          else
            echo "ArgoCD Application 'rancherupgrade-${ENVIRONMENT}' does not exist. Creating..."
            sed "s/CHARTVERSION/${CHART_VERSION}/g" argocd/${ENVIRONMENT}.yaml \
            | kubectl -n argocd apply -f - --validate=false
          fi

      - name: Wait for Deployment to Stabilize
        run: |
          MAX_TRIES=30
          SLEEP_TIME=10
          COUNTER=0
          while [ $COUNTER -lt $MAX_TRIES ]; do
            HEALTH_STATUS=$(kubectl -n argocd get applications rancherupgrade-${{ matrix.environment }} -o jsonpath='{.status.health.status}')
            echo "Current health status: $HEALTH_STATUS"
            if [ "$HEALTH_STATUS" = "Healthy" ]; then
              echo "Application is healthy."
              break
            fi
            echo "Waiting for application to become healthy..."
            sleep $SLEEP_TIME
            let COUNTER=COUNTER+1
          done
          if [ $COUNTER -eq $MAX_TRIES ]; then
            echo "Application did not become healthy in time."
            exit 1
          fi
