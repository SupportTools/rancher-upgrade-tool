# PR validation. Deliberately a SEPARATE workflow from pipeline.yml.
#
# pipeline.yml chains Test -> Build -> Publish -> Deploy through `needs:` with no
# `if:` branch guard on any job. The only thing keeping publication and deployment
# off pull requests is that pipeline.yml has no `pull_request` trigger. Adding one
# there would build an image, publish a chart to harbor.support.tools, patch six
# ArgoCD applications and roll unmerged code to rancher.tips.
#
# So validation lives here instead, where publishing and deploying are structurally
# unreachable rather than merely conditioned away. This workflow needs no registry
# credentials and no kubeconfig, which is also why it works for fork PRs.
name: Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  Validate:
    runs-on: self-hosted-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          # Matches go.mod. Note pipeline.yml pins "1.22", which setup-go resolves
          # to the newest 1.22.x, so CI and the shipped image can build on different
          # patch releases. Tracked as a separate concern.
          go-version-file: go.mod
          # GOCACHE/GOMODCACHE already live on the runner's persistent shared /cache; setup-go's cache step only re-archives it
          cache: false

      - name: Verify baked analysis tools
        # `make ci` needs staticcheck and gosec. Both are baked into the self-hosted
        # runner image (SupportTools/ci-runners), so nothing is downloaded at job
        # time (taskforge-2678). A missing tool is a runner-image regression: fail
        # loudly, never fall back to an unpinned go install.
        run: |
          set -euo pipefail
          for tool in staticcheck gosec; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on PATH. It must be baked into the runner image; fix SupportTools/ci-runners, do not download it here."
              exit 1
            fi
          done
          staticcheck -version
          gosec -version

      - name: Run the same checks humans run
        run: make ci

      - name: Build the binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/rancher-upgrade-tool .
