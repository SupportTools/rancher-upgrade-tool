apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancherupgrade-mst
spec:
  destination:
    namespace: rancherupgrade-mst
    server: https://kubernetes.default.svc
  project: rancherupgrade
  source:
    # Helm chart served over OCI from Harbor, replacing the git-backed
    # chart museum at charts.support.tools. That move also removed the
    # BOT_TOKEN dependency that was blocking deploys.
    #
    # repoURL must be the FULL artifact path, INCLUDING the chart name.
    # ArgoCD uses it verbatim to resolve the OCI digest and does NOT append
    # spec.source.chart. With the chart name omitted it looked for
    #   harbor.support.tools/rancher-upgrade-tool/charts:v0.223.0 -> not found
    # and sat at ComparisonError/Unknown while the old release kept serving.
    # Same shape as the working mattoxengineering and taskforge Applications.
    # The Harbor project is PUBLIC, so ArgoCD needs no registry credentials.
    chart: rancher-upgrade-tool
    helm:
      parameters:
        - name: ingress.host
          value: mst.rancher.tips
    repoURL: oci://harbor.support.tools/rancher-upgrade-tool/charts/rancher-upgrade-tool
    targetRevision: CHARTVERSION
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: "30m"
        factor: 2
        maxDuration: "5m"
