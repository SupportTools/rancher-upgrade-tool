<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rancher & Kubernetes Upgrade Planner</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="container">
        <!-- Rancher Logo -->
        <img src="https://www.rancher.com/assets/img/brand-guidelines/assets/logos/png/color/rancher-suse-logo-horizontal-color.png"
            alt="Rancher Logo" class="logo">

        <h1>Rancher Upgrade Planner</h1>

        <p class="lede">
            Rancher runs on one cluster and manages others. Both have version
            requirements, and the one Rancher itself runs on is usually what blocks
            the upgrade, so this asks for both.
        </p>

        <fieldset>
            <legend>Local cluster &mdash; where Rancher itself runs</legend>
            <div class="input-group">
                <label for="localPlatform">Platform</label>
                <select id="localPlatform">
                    <option value="rke2">RKE2</option>
                    <option value="k3s">K3s</option>
                    <option value="rke1">RKE1 (end of life)</option>
                    <option value="aks">AKS</option>
                    <option value="eks">EKS</option>
                    <option value="gke">GKE</option>
                </select>
            </div>
            <div class="input-group">
                <label for="localK8s">Kubernetes version</label>
                <input type="text" id="localK8s" placeholder="v1.28 (or 1.28)">
            </div>
        </fieldset>

        <fieldset>
            <legend>Downstream cluster &mdash; the one you are planning</legend>
            <div class="input-group">
                <label for="downstreamPlatform">Platform</label>
                <select id="downstreamPlatform">
                    <option value="rke2">RKE2</option>
                    <option value="k3s">K3s</option>
                    <option value="rke1">RKE1 (end of life)</option>
                    <option value="aks">AKS</option>
                    <option value="eks">EKS</option>
                    <option value="gke">GKE</option>
                </select>
            </div>
            <div class="input-group">
                <label for="downstreamK8s">Kubernetes version</label>
                <input type="text" id="downstreamK8s" placeholder="v1.28 (or 1.28)">
            </div>
        </fieldset>

        <div class="input-group">
            <label for="currentRancher">Current Rancher version</label>
            <input type="text" id="currentRancher" placeholder="v2.9.4 (or 2.9.4)">
        </div>

        <button id="planButton">Plan upgrade</button>

        <div id="planOutput" role="status" aria-live="polite"></div>
    </div>
</body>

</html>
